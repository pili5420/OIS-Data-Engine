name: OIS Production Runtime

on:
  schedule:
    # Existing cadence: 18:30 Asia/Taipei / 10:30 UTC, every day.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify a live candidate without publishing
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/ois_production.yml"
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  # Reuse the retired writer's lock while any old run is still in flight.
  group: ${{ github.event_name == 'pull_request' && github.ref || 'ois-data-update' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit, integration, schema, historical regression and production failure tests
        run: python -m unittest discover -s tests -v

  production:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      production_sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Checkout latest production state after acquiring concurrency lock
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Test checked-out code before production execution
        run: python -m unittest discover -s tests
      - name: Ingest, normalize, calculate indicators, update persistent rolling 180, validate and generate candidate
        run: >-
          python -m src.runtime.engine
          --candidate "$RUNNER_TEMP/ois-candidate"
          --report "$RUNNER_TEMP/ois-attempt.json"
      - name: Production dry run of atomic Git tree publication
        run: python -m src.runtime.publish --candidate "$RUNNER_TEMP/ois-candidate" --dry-run
      - name: Verify and package all four candidate outputs for Pages
        run: python -m scripts.prepare_pages --source "$RUNNER_TEMP/ois-candidate/data/production" --output "$RUNNER_TEMP/ois-pages"
      - name: Atomic publish of validated production snapshot and persistent history
        id: publish
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m src.runtime.publish --candidate "$RUNNER_TEMP/ois-candidate" --branch main
      - name: Upload verified Pages snapshot
        if: steps.publish.outputs.sha != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ois-pages
      - name: Preserve attempt report and candidate, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ois-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ois-attempt.json
            ${{ runner.temp }}/ois-candidate
          if-no-files-found: warn
          retention-days: 30
      - name: Runtime summary
        if: always()
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Runtime job: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Published commit: ${PUBLISHED_SHA:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/ois-attempt.json" ]; then
            cat "$RUNNER_TEMP/ois-attempt.json" >> "$GITHUB_STEP_SUMMARY"
          fi

  distribute-jsdelivr:
    needs: production
    if: needs.production.outputs.production_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.production.outputs.production_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Purge and verify the four mutable and four immutable URLs
        env:
          PRODUCTION_COMMIT: ${{ needs.production.outputs.production_sha }}
        run: >-
          python -m scripts.distribute_jsdelivr
          --repository "$GITHUB_REPOSITORY"
          --commit "$PRODUCTION_COMMIT"
          --output "$RUNNER_TEMP/ois-jsdelivr/ois_jsdelivr_distribution.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ois-jsdelivr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ois-jsdelivr/ois_jsdelivr_distribution.json
          if-no-files-found: error

  deploy-pages:
    needs: production
    if: needs.production.outputs.production_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
