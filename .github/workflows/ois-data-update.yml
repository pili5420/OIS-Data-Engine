name: OIS Data Update

on:
  schedule:
    # 18:30 Asia/Taipei. This is intended to finish before the 20:00 OIS review.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: Rebuild and validate production even without a new trading day
        type: boolean
        default: false

concurrency:
  group: ois-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      production_sha: ${{ steps.production.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run OIS updater
        env:
          OIS_FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_update || false }}
        run: |
          if [ "$OIS_FORCE_UPDATE" = "true" ]; then
            python ois_update.py --force
          else
            python ois_update.py
          fi

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Validate production
        run: python ois_update.py --validate-only

      - name: Commit production data if changed
        id: production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production data/archive logs
          if git diff --cached --quiet; then
            echo "No production data changes."
          else
            git commit -m "Update OIS production data"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare PASS production JSON for Pages
        run: python scripts/prepare_pages.py --output "$RUNNER_TEMP/ois-pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ois-pages

  distribute-jsdelivr:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout pushed production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.production_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Purge and verify jsDelivr distribution
        env:
          PRODUCTION_COMMIT: ${{ needs.update.outputs.production_sha }}
        run: >-
          python -m scripts.distribute_jsdelivr
          --repository "$GITHUB_REPOSITORY"
          --commit "$PRODUCTION_COMMIT"
          --output "$RUNNER_TEMP/ois-jsdelivr/ois_jsdelivr_distribution.json"

      - name: Preserve jsDelivr endpoint and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ois-jsdelivr-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ois-jsdelivr/ois_jsdelivr_distribution.json
          if-no-files-found: error

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy production JSON to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
